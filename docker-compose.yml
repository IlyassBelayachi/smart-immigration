# Base PostgreSQL + pgvector pour la suite (S3+). Inutile pour la demo n°1 (BM25 en memoire).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartimm
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: smartimm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
